[project]
name = "prime-agent-skill-mcp-servers"
version = "0.1.0"
description = "Generic configured MCP server access for Prime Agent."
requires-python = ">=3.10"
dependencies = ["mcp", "httpx", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_servers"]
